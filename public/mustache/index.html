<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hello</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #252525;
        text-align: center;
      }
      svg {
        width: min(70vw, 22rem);
        fill: currentColor;
        animation: twirl 2.4s ease-in-out infinite;
        transform-origin: 50% 40%;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 3.5rem);
        margin: 1.5rem 0 0;
      }
      @keyframes twirl {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        svg { animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #191919; color: #ecebe7; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 200 80" role="img" aria-label="A mustache">
        <path d="M100 30c-8-14-26-20-42-12-12 6-18 20-32 22-10 1-18-5-22-12 2 18 16 32 36 34 22 2 44-8 60-24 16 16 38 26 60 24 20-2 34-16 36-34-4 7-12 13-22 12-14-2-20-16-32-22-16-8-34-2-42 12z" />
      </svg>
      <h1>Hello, world.</h1>
    </main>
  </body>
</html>
